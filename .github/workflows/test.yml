name: test

# Gate for every change: formatting, vet and the full test suite. Runs on
# macOS because the tree includes darwin-only packages (utun, routing), and
# is reused by release.yml so nothing is published without passing it.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      # Third-party code is pinned by commit SHA, not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Not gofmt'ed:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
